name: Build and Deploy Watten Web App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web without PWA strategy
        run: flutter build web --release --pwa-strategy=none

      - name: Copy custom service worker
        run: cp web/flutter_service_worker.js build/web/flutter_service_worker.js

      - name: Verify service worker exists
        run: |
          if [ ! -f build/web/flutter_service_worker.js ]; then
            echo "Service worker missing — aborting deploy."
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
